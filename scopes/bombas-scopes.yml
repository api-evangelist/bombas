note: >-
  Bombas ships no OpenAPI, so these scopes were not derived from a spec. They
  are the scopes_supported list published verbatim by the Shopify customer
  account authorization server that fronts the Bombas storefront
  (issuer https://shopify.com/authentication/11195850). The UCP / MCP commerce
  endpoint at /api/ucp/mcp does not use these scopes - it authenticates the
  calling platform with a UCP-Agent profile URI instead - so this scope set
  covers customer-account access only.
schemes:
- name: shopify-customer-account-oidc
  source: well-known/bombas-openid-configuration.json
  issuer: https://shopify.com/authentication/11195850
  flows:
  - flow: authorizationCode
    authorizationUrl: https://shopify.com/authentication/11195850/oauth/authorize
    tokenUrl: https://shopify.com/authentication/11195850/oauth/token
    pkce: S256
scopes:
- scope: openid
  description: Standard OpenID Connect scope; requests an ID token identifying the
    signed-in Bombas customer.
  flows: [authorizationCode]
  sources: [well-known/bombas-openid-configuration.json]
- scope: email
  description: Releases the customer's email and email_verified claims.
  flows: [authorizationCode]
  sources: [well-known/bombas-openid-configuration.json]
- scope: customer-account-api:full
  description: Full access to the Shopify Customer Account API for the signed-in customer
    (orders, addresses, profile, subscriptions).
  flows: [authorizationCode]
  sources: [well-known/bombas-openid-configuration.json]
- scope: customer-account-mcp-api:full
  description: Full access to the Shopify customer-account MCP API for the signed-in
    customer - the authenticated, customer-scoped MCP surface, distinct from the
    anonymous UCP shopping MCP endpoint.
  flows: [authorizationCode]
  sources: [well-known/bombas-openid-configuration.json]
