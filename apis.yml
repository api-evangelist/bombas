apis:
- aid: bombas:commerce
  name: Bombas Commerce (UCP Shopping)
  description: 'The agent-facing commerce surface of the Bombas Shopify storefront.
    The store publishes a Universal Commerce Protocol merchant profile at
    https://shop.bombas.com/.well-known/ucp declaring UCP versions 2026-04-08 and
    2026-01-23, the dev.ucp.shopping service over an MCP transport at
    https://shop.bombas.com/api/ucp/mcp, and the checkout, cart, fulfillment,
    discount and payment-handler capabilities. The MCP endpoint implements the UCP
    Shopping Service OpenRPC contract of 13 methods covering catalog search, cart,
    checkout and order retrieval. tools/list is gated behind a UCP-Agent profile
    URI, so tool input schemas come from the published OpenRPC schema the merchant
    profile itself points at, not from live introspection.'
  humanURL: https://shop.bombas.com/agents.md
  baseURL: https://shop.bombas.com/api/ucp/mcp
