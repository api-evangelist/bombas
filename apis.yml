aid: bombas
name: Bombas
description: 'Bombas is a New York City based direct-to-consumer comfort apparel brand
  founded in 2013 by David Heath and Randy Goldberg, selling socks, underwear, t-shirts
  and slippers on a one-purchased-equals-one-donated model that has powered more than
  200 million donated items through a network of over 4,000 giving partners serving
  people experiencing homelessness. The company is privately held, was funded on Shark
  Tank in 2014, and runs its ecommerce on Shopify Plus. Bombas does not publish a
  first-party developer program or REST API, but its storefront at shop.bombas.com
  exposes a real agent-facing commerce surface: a published llms.txt / agents.md, a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and a live
  MCP endpoint at /api/ucp/mcp implementing the UCP Shopping Service, alongside OAuth
  2.0 / OpenID Connect discovery for Shopify customer accounts.'
